# SwiftLint configuration for Sortla.
# Run: swiftlint (config is picked up from this file automatically).

included:
  - waste-sort
  - waste-sortTests

function_body_length:
  warning: 60
  error: 120

# Transitional ceilings: RecordingController/SettingsView are being split in
# this branch; tighten back to 600/500 once those god files are gone.
file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 300
  error: 800

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 5

identifier_name:
  min_length: 1
  max_length: 40
  excluded:
    - id

line_length:
  warning: 140
  error: 200
  ignores_urls: true

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - force_unwrapping
  - redundant_type_annotation

force_unwrapping:
  severity: warning
