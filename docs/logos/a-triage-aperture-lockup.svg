<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 640" width="1800" height="640">
<defs><radialGradient id="lk-bg" cx="30%" cy="30%" r="110%"><stop offset="0%" stop-color="#1C242F"/><stop offset="100%" stop-color="#0B0F15"/></radialGradient></defs><rect width="1800" height="640" rx="44" fill="url(#lk-bg)"/>
<g transform="translate(72 72) scale(0.3867)">
  <defs>
    <radialGradient id="a-bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1B222C"/>
      <stop offset="100%" stop-color="#0B0F15"/>
    </radialGradient>
    <linearGradient id="a-green" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#3ED46E"/>
      <stop offset="100%" stop-color="#149A45"/>
    </linearGradient>
    <linearGradient id="a-amber" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFD34D"/>
      <stop offset="100%" stop-color="#DD9A06"/>
    </linearGradient>
    <linearGradient id="a-steel" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#68707A"/>
      <stop offset="100%" stop-color="#3A3F47"/>
    </linearGradient>
    <radialGradient id="a-pupil" cx="38%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#232C38"/>
      <stop offset="55%" stop-color="#10151C"/>
      <stop offset="100%" stop-color="#04070B"/>
    </radialGradient>
    <filter id="a-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <path id="a-blade" d="M 512 172 A 340 340 0 0 1 838.8 605.7 Q 796 648 644.4 615.4 A 170 170 0 0 0 589.5 366.3 Q 576.7 270.5 512 172 Z"/>
  </defs>

  <rect width="1024" height="1024" fill="url(#a-bg)"/>

  <!-- lens seat ring -->
  <circle cx="512" cy="512" r="148" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="10"/>

  <!-- tri-blade shutter -->
  <use href="#a-blade" fill="url(#a-green)"/>
  <use href="#a-blade" fill="url(#a-steel)" transform="rotate(120 512 512)"/>
  <use href="#a-blade" fill="url(#a-amber)" transform="rotate(240 512 512)"/>

  <!-- pupil -->
  <circle cx="512" cy="512" r="124" fill="url(#a-pupil)"/>
  <ellipse cx="472" cy="472" rx="42" ry="23" transform="rotate(-35 472 472)" fill="#FFFFFF" opacity="0.32" filter="url(#a-glow)"/>
  <circle cx="462" cy="462" r="13" fill="#FFFFFF" opacity="0.85"/>
</g>
<text x="600" y="372" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
      font-size="216" font-weight="650" letter-spacing="-5" fill="#F2F4F6">sortla</text>
<text x="608" y="468" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
      font-size="42" font-weight="520" letter-spacing="13" fill="#93A0B0">SEE IT. BIN IT.</text>
</svg>
